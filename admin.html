<script>

// ===== VERCEL SERVER.JS - PRIMARY (Firebase backup) =====
let _vercelOn = false;

}

}

const DB_URL="https://zarora-f7526-default-rtdb.firebaseio.com/zarorat.json";

let _lastJSON="", _lastInteraction=0, _pushing=false, _serverStatus="CONNECTING", _syncCount=0, _lastSyncTime=0;

let _pushQueue=[], _pushTimer=null, _isOnline=navigator.onLine!==false;

function pushToFirebase(force){ let j=JSON.stringify(DB); if(!force&&j===_lastJSON) return; if(!_isOnline){ _pushQueue.push(j); setServerStatus("OFFLINE - QUEUED"); return; } if(_pushing&&!force){ _pushQueue.push(j); flushPushQueue(); return; } doPush(j); }
function saveDB(){ try{ localStorage.setItem(DB_KEY,JSON.stringify(DB)); }catch(e){} try{ let bc=new BroadcastChannel("zarorat-live"); bc.postMessage({db:DB,t:Date.now()}); bc.close(); }catch(e){} try{ localStorage.setItem("zarorat_live_ping",String(Date.now())); }catch(e){} pushMaximumFast(); }
function applyRemoteData(d,src){ if(!d||typeof d!=="object") return false; if(!(d.users||d.services||d.orders)) return false; let nj=JSON.stringify(d); if(nj===_lastJSON) return false; DB=d; for(let k in EMPTY_DB()) if(!DB[k]) DB[k]=EMPTY_DB()[k]; _lastJSON=nj; _syncCount++; _lastSyncTime=Date.now(); setServerStatus("CONNECTED"); try{localStorage.setItem(DB_KEY,nj);}catch(e){} onRemoteChange&&onRemoteChange(); return true; }
async function fastPull(){ try{ if(await vercelPull()) return; }catch(e){}  setServerStatus("SYNCING"); fetch(DB_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) return null; return r.json(); }).then(d=>{ if(d) applyRemoteData(d,"pull"); else if(d===null) pushToFirebase(true); else setServerStatus("CONNECTED"); }).catch(()=>{ setServerStatus("RETRYING"); }); }
let _ws=null,_wsId=1,_wsRetry=0,_wsPing=null,_es=null,_ws2=null;
function startMaximumFastServer(){
  try{ if(_ws && (_ws.readyState===0||_ws.readyState===1)) return; }catch(e){}
  try{ if(_ws) _ws.close(); }catch(e){}
  try{
    _ws=new WebSocket("wss://zarora-f7526-default-rtdb.firebaseio.com/.ws?v=5&ns=zarora-f7526-default-rtdb");

}
async function pushMaximumFast(){ try{ if(await vercelPush()) return; }catch(e){}  try{ if(_ws&&_ws.readyState===1){ _ws.send(JSON.stringify({t:"d",d:{r:_wsId++,a:"p",b:{p:"/zarorat",d:DB}}})); } }catch(e){} try{ if(_ws2&&_ws2.readyState===1){ _ws2.send(JSON.stringify({t:"d",d:{r:998,a:"p",b:{p:"/zarorat",d:DB}}})); } }catch(e){} pushToFirebase(true); }
document.addEventListener('pointerdown',()=>{_lastInteraction=Date.now();},true); document.addEventListener('input',()=>{_lastInteraction=Date.now();},true);

let onRemoteChange=null;

function panelHTML(){
 let totalRev=DB.orders.filter(o=>o.status!=="Cancelled"&&o.status!=="Refunded").reduce((s,o)=>s+o.price,0);
 let pendOrd=DB.orders.filter(o=>o.status==="Pending").length, pendDep=DB.deposits.filter(d=>d.status==="Pending").length, openTick=DB.tickets.filter(t=>t.status==="Open").length;

 if(tab==="services"){

 if(tab==="orders"){

 }
 if(tab==="deposits"){
  let list=DB.deposits.filter(d=>depFilter==="All"||d.status===depFilter);
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon">₨</span> Deposits</h2><p class="muted">Easypaisa: 03493959558 — Mohammad Ajmal</p><div style="display:flex;gap:8px">${["All","Pending","Approved","Rejected"].map(s=>`<button type="button" class="btn2" onclick="setDepFilter('${s}')">${s}</button>`).join("")}</div>`;
  body+= list.length?list.map(d=>`<div class="card"><div class="row"><div><b style="font-size:22px">${money(d.amount)}</b><p class="muted">@${esc(d.username)} • TID: <b style="color:#fff">${esc(d.tid)}</b></p><p class="muted">${esc(d.note||"")} • ${new Date(d.createdAt).toLocaleString()}</p></div><span class="pill ${d.status==="Approved"?"ok":d.status==="Rejected"?"bad":"warn"}">${d.status}</span></div>${d.status==="Pending"?`<div class="flex mt"><button type="button" class="btn" style="flex:1;padding:12px" onclick="approveDep('${d.id}')">Approve - Add Balance</button><button type="button" class="btn2" style="flex:1" onclick="rejectDep('${d.id}')">Reject</button></div>`:""}</div>`).join("") : `<div class="card" style="text-align:center">No deposits yet</div>`;
 }
 if(tab==="users"){
  let list=DB.users.filter(u=>(u.name+" "+u.username+" "+u.email).toLowerCase().includes(usrSearch.toLowerCase()));
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon gold">●●</span> Users</h2><input class="input" placeholder="Search users..." value="${esc(usrSearch)}" oninput="usrSearch=this.value;render()">`;
  body+= list.length?list.map(u=>{ let spent=DB.orders.filter(o=>o.userId===u.id).reduce((s,o)=>s+o.price,0); return `<div class="card"><div class="row"><div><b>${esc(u.name)} (@${esc(u.username)})</b><p class="muted">${esc(u.email)} • Balance ${money(u.balance)} • Spent ${money(spent)}</p><p class="muted">Referral: ${u.referralCode||"-"} • Joined ${new Date(u.createdAt).toLocaleDateString()}</p></div><span class="pill ${u.status==="Blocked"?"bad":"ok"}">${u.status||"Active"}</span></div><div class="flex mt"><button type="button" class="btn2" style="flex:1" onclick="adjustBalance('${u.id}')">Adjust Balance</button><button type="button" class="btn2" style="flex:1" onclick="toggleUser('${u.id}')">${u.status==="Blocked"?"Unblock":"Block"}</button><button type="button" class="btn2" style="flex:1;color:#ff8a94" onclick="delUser('${u.id}')">Delete</button></div><div id="bal-${u.id}"></div></div>`; }).join("") : `<div class="card" style="text-align:center">No users yet</div>`;
 }
 if(tab==="tickets"){
  let list=DB.tickets.filter(t=>tickFilter==="All"||t.status===tickFilter);
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon blue">◉</span> Tickets</h2><div style="display:flex;gap:8px">${["All","Open","Closed"].map(s=>`<button type="button" class="btn2" onclick="setTickFilter('${s}')">${s}</button>`).join("")}</div>`;
  body+= list.length?list.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.subject)}</b><p class="muted">@${esc(t.username)} • ${new Date(t.createdAt).toLocaleString()}</p><p>${esc(t.message)}</p></div><span class="pill warn">${t.status}</span></div>${(t.replies||[]).map(r=>`<div class="card" style="background:#08110e"><b>${r.sender==="support"?"SUPPORT":"USER"}</b> • ${new Date(r.at).toLocaleString()}<p>${esc(r.text)}</p></div>`).join("")}<div class="flex mt"><input id="ar-${t.id}" class="input" style="margin:0" placeholder="Write reply..."><button type="button" class="btn2" onclick="adminReply('${t.id}')">Send Reply</button></div><div class="flex mt"><button type="button" class="btn2" onclick="setTicket('${t.id}','Closed')">Close Ticket</button><button type="button" class="btn2" onclick="setTicket('${t.id}','Open')">Reopen</button></div></div>`).join("") : `<div class="card" style="text-align:center">No tickets yet</div>`;
 }
 if(tab==="coupons"){
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon gold">◈</span> Coupons</h2><div class="card"><label class="label">Coupon Code</label><input id="cCode" class="input" placeholder="e.g. SAVE10"><label class="label">Discount %</label><input id="cDisc" type="number" class="input" placeholder="10"><button type="button" class="btn" style="margin-top:12px" onclick="addCoupon()">Add Coupon</button></div>`;
  body+= DB.coupons.length?DB.coupons.map(c=>`<div class="card"><div class="row"><b>${esc(c.code)} — ${c.discountPercent}% OFF</b><span class="pill ${c.active?"ok":"bad"}">${c.active?"Active":"Inactive"}</span></div><div class="flex mt"><button type="button" class="btn2" onclick="toggleCoupon('${c.id}')">${c.active?"Deactivate":"Activate"}</button><button type="button" class="btn2" style="color:#ff8a94" onclick="delCoupon('${c.id}')">Delete</button></div></div>`).join("") : `<div class="card" style="text-align:center">No coupons yet</div>`;
 }
 if(tab==="announcements"){
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon">◉</span> Announcements</h2><div class="card"><label class="label">Title</label><input id="aTitle" class="input" placeholder="e.g. New services added"><label class="label">Message</label><textarea id="aMsg" class="input" rows="3" placeholder="Write announcement..."></textarea><button type="button" class="btn" style="margin-top:12px" onclick="addAnn()">Publish Announcement</button></div>`;
  body+= DB.announcements.length?DB.announcements.map(a=>`<div class="card"><b>${esc(a.title)}</b><p>${esc(a.message)}</p><div class="flex mt"><button type="button" class="btn2" onclick="toggleAnn('${a.id}')">${a.enabled?"Hide":"Show"}</button><button type="button" class="btn2" style="color:#ff8a94" onclick="delAnn('${a.id}')">Delete</button></div></div>`).join("") : `<div class="card" style="text-align:center">No announcements yet</div>`;
 }
 if(tab==="notify"){
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon gold">◎</span> Send Notification</h2><div class="card"><label class="label">Title</label><input id="nTitle" class="input" placeholder="e.g. New Offer"><label class="label">Message</label><textarea id="nMsg" class="input" rows="3" placeholder="Write message..."></textarea><button type="button" class="btn" style="margin-top:12px" onclick="sendNotif()">Send to All Users</button></div>`;
 }
 if(tab==="settings"){
  body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon dark">⚙</span> Settings</h2><div class="card"><label class="label">Panel Name</label><input id="setName" class="input" value="${esc(DB.settings.panelName)}"><label class="label">Minimum Deposit (Rs)</label><input id="setMin" type="number" class="input" value="${DB.settings.minDeposit}"><label class="label">Referral Bonus %</label><input id="setRef" type="number" class="input" value="${DB.settings.referralBonus}"><label class="label">Support Message</label><textarea id="setSup" class="input" rows="2">${esc(DB.settings.supportMessage)}</textarea><button type="button" class="btn" style="margin-top:12px" onclick="saveSettings()">Save Settings - Live</button></div><div class="card"><h3><span class="picon">₨</span> Deposit Account</h3><p><b>Easypaisa:</b> 03493959558</p><p><b>Name:</b> Mohammad Ajmal</p><p class="muted">Shown to users on Deposit page.</p></div>`;
 }
 return `<div class="wrap-wide"><div class="serverbar" id="serverBar"><span class="live"></span> FULL HEAVY SERVER • CONNECTED</div><div class="sticky" style="margin-top:12px"><div class="row"><div class="logo"><div class="z">Z</div><div><b style="font-family:'Space Grotesk'">ZARORAT <span class="green">PREMIUM CONTROL</span></b><div class="muted"><span class="live"></span> Full Heavy Server • Live</div></div></div><button type="button" class="btn2" onclick="location.reload()">↻ Refresh</button></div><div style="display:flex;gap:8px;overflow:auto;margin-top:12px">${[["dashboard","▦","Dashboard"],["services","◈","Services"],["orders","≡","Orders"],["deposits","₨","Deposits"],["users","●●","Users"],["tickets","◉","Tickets"],["coupons","◈","Coupons"],["announcements","◉","Announcements"],["notify","◎","Notify"],["settings","⚙","Settings"]].map(x=>`<button type="button" class="btn2" style="${tab===x[0]?'background:linear-gradient(100deg,#00e676,#00c2a8);color:#03110a':''};white-space:nowrap" onclick="go('${x[0]}')"><span class="picon" style="width:20px;height:20px;font-size:11px">${x[1]}</span> ${x[2]}</button>`).join("")}</div></div>${body}</div>`;
}
function setSvcFilter(c){ svcFilter=c; render(); }
function setOrdFilter(c){ ordFilter=c; render(); }
function setDepFilter(c){ depFilter=c; render(); }
function setTickFilter(c){ tickFilter=c; render(); }
function addService(){ let n=document.getElementById("sName").value.trim(),cat=document.getElementById("sCat").value.trim()||"Other",pr=Number(document.getElementById("sPrice").value),mn=Number(document.getElementById("sMin").value)||10,mx=Number(document.getElementById("sMax").value)||10000,desc=document.getElementById("sDesc").value.trim(); if(!n||!pr){ toast("Enter service name and price."); return; } DB.services.unshift({id:uid(),name:n,category:cat,pricePer1000:pr,min:mn,max:mx,description:desc,enabled:true,createdAt:new Date().toISOString()}); saveDB(); log("Service added: "+n); confetti(); toast("Service is now live!"); render(); }
function toggleService(id){ let s=DB.services.find(x=>x.id===id); s.enabled = s.enabled===false ? true : false; saveDB(); render(); }
function editService(id){ let s=DB.services.find(x=>x.id===id); let el=document.getElementById("edit-"+id); el.innerHTML=`<div class="card" style="margin-top:10px"><label class="label">Price / 1000</label><input id="ep-${id}" type="number" class="input" value="${s.pricePer1000}"><label class="label">Min</label><input id="emn-${id}" type="number" class="input" value="${s.min}"><label class="label">Max</label><input id="emx-${id}" type="number" class="input" value="${s.max}"><button type="button" class="btn" style="margin-top:10px" onclick="saveEdit('${id}')">Save Changes</button></div>`; }
function saveEdit(id){ let s=DB.services.find(x=>x.id===id); s.pricePer1000=Number(document.getElementById("ep-"+id).value); s.min=Number(document.getElementById("emn-"+id).value); s.max=Number(document.getElementById("emx-"+id).value); saveDB(); toast("Service updated!"); render(); }
function delService(id){ if(!confirm("Delete this service?")) return; DB.services=DB.services.filter(x=>x.id!==id); saveDB(); render(); }
function setOrder(id,st){ let o=DB.orders.find(x=>x.id===id); o.status=st; if(st==="Refunded"){ let u=DB.users.find(x=>x.id===o.userId); if(u){ u.balance+=o.price; } } saveDB(); log(`Order marked as ${st}: ${o.serviceName}`); toast(`Order → ${st}`); render(); }
function approveDep(id){ let d=DB.deposits.find(x=>x.id===id); d.status="Approved"; let u=DB.users.find(x=>x.id===d.userId); if(u){ u.balance+=d.amount; DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Deposit",title:"Deposit - Easypaisa",amount:d.amount,status:"Paid",createdAt:new Date().toISOString()}); } saveDB(); log(`Deposit approved: ${money(d.amount)} for @${d.username}`); confetti(); toast("Deposit approved - balance updated live!"); render(); }
function rejectDep(id){ let d=DB.deposits.find(x=>x.id===id); d.status="Rejected"; saveDB(); render(); }
function adjustBalance(id){ let el=document.getElementById("bal-"+id); el.innerHTML=`<div class="flex mt"><input id="balv-${id}" type="number" class="input" style="margin:0" placeholder="e.g. 500"><button type="button" class="btn2" onclick="doAdjust('${id}')">Add Balance</button></div>`; }
function doAdjust(id){ let v=Number(document.getElementById("balv-"+id).value); if(!v){ toast("Enter amount."); return; } let u=DB.users.find(x=>x.id===id); u.balance+=v; DB.transactions.unshift({id:uid(),userId:u.id,username:u.username,type:"Adjustment",title:"Balance adjustment",amount:v,status:"Paid",createdAt:new Date().toISOString()}); saveDB(); toast("Balance updated!"); render(); }
function toggleUser(id){ let u=DB.users.find(x=>x.id===id); u.status = u.status==="Blocked" ? "Active" : "Blocked"; saveDB(); render(); }
function delUser(id){ if(!confirm("Delete this user?")) return; DB.users=DB.users.filter(x=>x.id!==id); saveDB(); render(); }
function adminReply(id){ let v=document.getElementById("ar-"+id).value.trim(); if(!v) return; let t=DB.tickets.find(x=>x.id===id); t.replies.push({sender:"support",text:v,at:new Date().toISOString()}); t.status="Open"; saveDB(); toast("Reply sent live!"); render(); }
function setTicket(id,st){ let t=DB.tickets.find(x=>x.id===id); t.status=st; saveDB(); render(); }
function addCoupon(){ let code=document.getElementById("cCode").value.trim().toUpperCase(),disc=Number(document.getElementById("cDisc").value); if(!code||!disc){ toast("Enter code and discount."); return; } DB.coupons.unshift({id:uid(),code,discountPercent:disc,active:true,createdAt:new Date().toISOString()}); saveDB(); toast("Coupon added!"); render(); }
function toggleCoupon(id){ let c=DB.coupons.find(x=>x.id===id); c.active=!c.active; saveDB(); render(); }
function delCoupon(id){ DB.coupons=DB.coupons.filter(x=>x.id!==id); saveDB(); render(); }
function addAnn(){ let t=document.getElementById("aTitle").value.trim(),m=document.getElementById("aMsg").value.trim(); if(!t||!m){ toast("Enter title and message."); return; } DB.announcements.unshift({id:uid(),title:t,message:m,enabled:true,createdAt:new Date().toISOString()}); saveDB(); toast("Announcement published!"); render(); }
function toggleAnn(id){ let a=DB.announcements.find(x=>x.id===id); a.enabled=!a.enabled; saveDB(); render(); }
function delAnn(id){ DB.announcements=DB.announcements.filter(x=>x.id!==id); saveDB(); render(); }
function sendNotif(){ let t=document.getElementById("nTitle").value.trim(),m=document.getElementById("nMsg").value.trim(); if(!t||!m){ toast("Enter title and message."); return; } notify("all",t,m); toast("Notification sent live!"); render(); }
function saveSettings(){ DB.settings.panelName=document.getElementById("setName").value.trim()||"ZARORAT"; DB.settings.minDeposit=Number(document.getElementById("setMin").value)||50; DB.settings.referralBonus=Number(document.getElementById("setRef").value)||5; DB.settings.supportMessage=document.getElementById("setSup").value.trim(); saveDB(); toast("Settings saved live!"); render(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fastPull(); });
window.addEventListener('focus',()=>{ fastPull(); });
onRemoteChange=()=>{ safeRender(); };
loadDB(); _lastJSON=JSON.stringify(DB); render(); startLiveSync(); startMaximumFastServer();
window.unlock=unlock; window.go=go; window.setSvcFilter=setSvcFilter; window.setOrdFilter=setOrdFilter; window.setDepFilter=setDepFilter; window.setTickFilter=setTickFilter; window.addService=addService; window.toggleService=toggleService; window.editService=editService; window.saveEdit=saveEdit; window.delService=delService; window.setOrder=setOrder; window.approveDep=approveDep; window.rejectDep=rejectDep; window.adjustBalance=adjustBalance; window.doAdjust=doAdjust; window.toggleUser=toggleUser; window.delUser=delUser; window.adminReply=adminReply; window.setTicket=setTicket; window.addCoupon=addCoupon; window.toggleCoupon=toggleCoupon; window.delCoupon=delCoupon; window.addAnn=addAnn; window.toggleAnn=toggleAnn; window.delAnn=delAnn; window.sendNotif=sendNotif; window.saveSettings=saveSettings;
</script></body></html>
