<script>

// ===== VERCEL SERVER.JS - PRIMARY (Firebase backup) =====
let _vercelOn = false;
async function vercelPull(){
  try{
    let r = await fetch('/api/db? t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return false;
    let d = await r.json();
    if(d && typeof d==='object'){ _vercelOn=true; return applyRemoteData(d,'vercel'); }
  }catch(e){}
  return false;
}
function startVercelStream(){
  try{
    let es = new EventSource('/api/events');
    es.onmessage = (e)=>{ try{ let d=JSON.parse(e.data); if(d&&d.users) { _vercelOn=true; applyRemoteData(d,'vercel-stream'); } }catch(err){} };
    es.onerror = ()=>{ try{es.close();}catch(e){} setTimeout(startVercelStream, 2000); };
  }catch(e){}
}
async function vercelPush(){
  try{ let r = await fetch('/api/db',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB),keepalive:true,cache:'no-store'}); if(r.ok){ _vercelOn=true; return true; } }catch(e){}
  return false;
}

const DB_URL="https://zarora-f7526-default-rtdb.firebaseio.com/zarorat.json";
let DB=null; const DB_KEY="zarorat_db_v3";
const EMPTY_DB=()=>({users:[],services:[],orders:[],deposits:[],tickets:[],notifications:[],coupons:[],announcements:[],categories:[],activity:[],settings:{panelName:"ZARORAT",minDeposit:50,referralBonus:5,supportMessage:"Ask the support team anything. Replies appear inside your ticket."},favorites:[],transactions:[]});
function loadDB(){ try{ let s=localStorage.getItem(DB_KEY); DB=s?JSON.parse(s):EMPTY_DB(); }catch(e){ DB=EMPTY_DB(); } for(let k in EMPTY_DB()) if(!DB[k]) DB[k]=EMPTY_DB()[k]; return DB; }
let _lastJSON="", _lastInteraction=0, _pushing=false, _serverStatus="CONNECTING", _syncCount=0, _lastSyncTime=0;
// ===== FULL HEAVY SERVER - QUEUE + RETRY + MULTI-CHANNEL =====
let _pushQueue=[], _pushTimer=null, _isOnline=navigator.onLine!==false;
window.addEventListener('online',()=>{_isOnline=true; flushPushQueue();});
window.addEventListener('offline',()=>{_isOnline=false;});
function updateServerBar(){ let el=document.getElementById("serverBar"); if(!el) return; let dot=_serverStatus==="CONNECTED"?"#00e676":_serverStatus==="SYNCING"?"#ffd88a":"#ff5d6c"; el.innerHTML=`<span class="live" style="background:${dot}"></span> FULL HEAVY SERVER • ${_serverStatus} • SYNC ${_syncCount} • ${_isOnline?"ONLINE":"OFFLINE - QUEUED"}`; }
function setServerStatus(s){ _serverStatus=s; updateServerBar(); }
function flushPushQueue(){ if(_pushTimer) return; _pushTimer=setTimeout(()=>{ _pushTimer=null; if(!_pushQueue.length) return; let latest=_pushQueue[_pushQueue.length-1]; _pushQueue=[]; doPush(latest); },120); }
function doPush(j){ _pushing=true; setServerStatus("SYNCING"); let c=new AbortController(); setTimeout(()=>{ try{c.abort();}catch(e){} _pushing=false; },4000); fetch(DB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:j,signal:c.signal,keepalive:true,cache:"no-store"}).then(()=>{ _pushing=false; _lastJSON=j; _syncCount++; _lastSyncTime=Date.now(); setServerStatus("CONNECTED"); }).catch(()=>{ _pushing=false; _pushQueue.push(j); setServerStatus("RETRYING"); setTimeout(flushPushQueue,800); }); }
function pushToFirebase(force){ let j=JSON.stringify(DB); if(!force&&j===_lastJSON) return; if(!_isOnline){ _pushQueue.push(j); setServerStatus("OFFLINE - QUEUED"); return; } if(_pushing&&!force){ _pushQueue.push(j); flushPushQueue(); return; } doPush(j); }
function saveDB(){ try{ localStorage.setItem(DB_KEY,JSON.stringify(DB)); }catch(e){} try{ let bc=new BroadcastChannel("zarorat-live"); bc.postMessage({db:DB,t:Date.now()}); bc.close(); }catch(e){} try{ localStorage.setItem("zarorat_live_ping",String(Date.now())); }catch(e){} pushMaximumFast(); }
function applyRemoteData(d,src){ if(!d||typeof d!=="object") return false; if(!(d.users||d.services||d.orders)) return false; let nj=JSON.stringify(d); if(nj===_lastJSON) return false; DB=d; for(let k in EMPTY_DB()) if(!DB[k]) DB[k]=EMPTY_DB()[k]; _lastJSON=nj; _syncCount++; _lastSyncTime=Date.now(); setServerStatus("CONNECTED"); try{localStorage.setItem(DB_KEY,nj);}catch(e){} onRemoteChange&&onRemoteChange(); return true; }
async function fastPull(){ try{ if(await vercelPull()) return; }catch(e){}  setServerStatus("SYNCING"); fetch(DB_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) return null; return r.json(); }).then(d=>{ if(d) applyRemoteData(d,"pull"); else if(d===null) pushToFirebase(true); else setServerStatus("CONNECTED"); }).catch(()=>{ setServerStatus("RETRYING"); }); }
let _ws=null,_wsId=1,_wsRetry=0,_wsPing=null,_es=null,_ws2=null;
function startMaximumFastServer(){
  try{ if(_ws && (_ws.readyState===0||_ws.readyState===1)) return; }catch(e){}
  try{ if(_ws) _ws.close(); }catch(e){}
  try{
    _ws=new WebSocket("wss://zarora-f7526-default-rtdb.firebaseio.com/.ws?v=5&ns=zarora-f7526-default-rtdb");
    _ws.onopen=()=>{ _wsRetry=0; setServerStatus("CONNECTED"); try{ _ws.send(JSON.stringify({t:"d",d:{r:_wsId++,a:"l",b:{p:"/zarorat",h:""}}})); }catch(e){} clearInterval(_wsPing); _wsPing=setInterval(()=>{ try{ if(_ws&&_ws.readyState===1) _ws.send(JSON.stringify({t:"c",d:{t:"p",d:{}}})); }catch(e){} },18000); fastPull(); };
    _ws.onmessage=(ev)=>{ try{ let msg=JSON.parse(ev.data); if(msg.t==="c") return; let d=msg.d||{}; if(d.b&&d.b.d!==undefined&&d.b.d!==null){ let payload=d.b.d; if(payload&&typeof payload==="object"){ if(payload.users||payload.services||payload.orders){ applyRemoteData(payload,"ws"); } else if(d.b.p&&String(d.b.p).indexOf("/zarorat/")===0){ let field=String(d.b.p).replace("/zarorat/","").split("/")[0]; if(field){ let m=JSON.parse(JSON.stringify(DB||EMPTY_DB())); m[field]=payload; applyRemoteData(m,"ws-field"); } } } return; } if((d.a==="d"||d.a==="m")&&d.b&&d.b.d!==undefined&&d.b.d!==null){ let p=String(d.b.p||"/zarorat"); let val=d.b.d; if(p==="/zarorat"){ applyRemoteData(val,"ws"); } else if(p.indexOf("/zarorat/")===0){ let field=p.replace("/zarorat/","").split("/")[0]; if(field){ let m=JSON.parse(JSON.stringify(DB||EMPTY_DB())); m[field]=val; applyRemoteData(m,"ws-field"); } } } }catch(e){} };
    _ws.onclose=()=>{ setServerStatus("RECONNECTING"); clearInterval(_wsPing); _wsRetry++; setTimeout(()=>startMaximumFastServer(), Math.min(600+_wsRetry*300,2500)); };
    _ws.onerror=()=>{ try{_ws.close();}catch(e){} };
  }catch(e){}
  try{ if(_es) _es.close(); _es=new EventSource(DB_URL+"?ns=zarora-f7526-default-rtdb"); _es.onmessage=(e)=>{ try{ if(!e.data||e.data==="null") return; let j=JSON.parse(e.data); let data=j.data!==undefined?j.data:j; if(data&&data.users) applyRemoteData(data,"stream"); }catch(err){} }; }catch(e){}
  // Second WebSocket - double connection for heavy load (agar ek toot jaye, doosra pakde)
  try{ if(_ws2) _ws2.close(); _ws2=new WebSocket("wss://zarora-f7526-default-rtdb.firebaseio.com/.ws?v=5&ns=zarora-f7526-default-rtdb"); _ws2.onopen=()=>{ try{ _ws2.send(JSON.stringify({t:"d",d:{r:999,a:"l",b:{p:"/zarorat",h:""}}})); }catch(e){} }; _ws2.onmessage=(ev)=>{ try{ let msg=JSON.parse(ev.data); if(msg.t==="c") return; let d=msg.d||{}; if(d.b&&d.b.d!==undefined&&d.b.d!==null&&d.b.d.users) applyRemoteData(d.b.d,"ws2"); }catch(e){} }; }catch(e){}
}
async function pushMaximumFast(){ try{ if(await vercelPush()) return; }catch(e){}  try{ if(_ws&&_ws.readyState===1){ _ws.send(JSON.stringify({t:"d",d:{r:_wsId++,a:"p",b:{p:"/zarorat",d:DB}}})); } }catch(e){} try{ if(_ws2&&_ws2.readyState===1){ _ws2.send(JSON.stringify({t:"d",d:{r:998,a:"p",b:{p:"/zarorat",d:DB}}})); } }catch(e){} pushToFirebase(true); }
document.addEventListener('pointerdown',()=>{_lastInteraction=Date.now();},true); document.addEventListener('input',()=>{_lastInteraction=Date.now();},true);
function isTyping(){ let a=document.activeElement; return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'); }
function safeRender(f){ if(!f&&(isTyping()||Date.now()-_lastInteraction<400)){ setTimeout(()=>safeRender(true),500); return; } let saved={}; document.querySelectorAll('input,textarea,select').forEach(el=>{ if(el.id) saved[el.id]=el.value; }); try{ render(); }catch(e){} try{ updateServerBar(); }catch(e){} Object.keys(saved).forEach(id=>{ let el=document.getElementById(id); if(el&&document.activeElement!==el) el.value=saved[id]; }); }
function startLiveSync(){ try{ let bc=new BroadcastChannel("zarorat-live"); bc.onmessage=(e)=>{ if(e.data&&e.data.db){ let nj=JSON.stringify(e.data.db); if(nj!==_lastJSON){ DB=e.data.db; _lastJSON=nj; try{localStorage.setItem(DB_KEY,nj);}catch(err){} onRemoteChange&&onRemoteChange(); } } }; }catch(e){} window.addEventListener("storage",(e)=>{ if(e.key===DB_KEY&&e.newValue){ let nj=e.newValue; if(nj!==_lastJSON){ try{DB=JSON.parse(nj);}catch(err){} _lastJSON=nj; onRemoteChange&&onRemoteChange(); } } }); setInterval(()=>{ try{ let s=localStorage.getItem(DB_KEY); if(s&&s!==_lastJSON){ DB=JSON.parse(s); _lastJSON=s; onRemoteChange&&onRemoteChange(); } }catch(e){} },80); setInterval(()=>{ fastPull(); },180); setTimeout(()=>{ fastPull(); startMaximumFastServer(); startVercelStream(); },80); }
let onRemoteChange=null;
function toast(m){ let t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function confetti(){ for(let i=0;i<32;i++){ let c=document.createElement("div"); c.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:9px;height:13px;background:${["#00e676","#2dd4ff","#c8ff3d","#fff"][i%4]};z-index:200;border-radius:2px;animation:confetti ${1+Math.random()}s ease-in forwards`; document.body.appendChild(c); setTimeout(()=>c.remove(),2200); } }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function esc(s){ return String(s||"").replace(/</g,"&lt;"); }
function money(n){ return "Rs "+(n||0); }
function log(t){ DB.activity.unshift({text:t,createdAt:new Date().toISOString()}); saveDB(); }
function notify(u2,t,m){ DB.notifications.unshift({id:uid(),userId:u2,title:t,message:m,readBy:[],createdAt:new Date().toISOString()}); saveDB(); }
document.addEventListener('click',(e)=>{ let b=e.target.closest('button'); if(!b) return; b.style.transform="scale(0.96)"; setTimeout(()=>{b.style.transform="";},150); },true);

let cur=null;try{cur=JSON.parse(localStorage.getItem("zarorat_cur")||"null");}catch(e){cur=null;}
let screen=cur?"user":"auth",tab="home",authMode="login",catFilter="All",search="",sortBy="featured";
function save(){saveDB();if(cur)localStorage.setItem("zarorat_cur",JSON.stringify(cur));else localStorage.removeItem("zarorat_cur");}
function level(s){if(s>=20000)return{name:"VIP",next:"Top level reached",p:100};if(s>=5000)return{name:"Gold",next:"Spend Rs 20,000 for VIP",p:s/200};if(s>=1000)return{name:"Silver",next:"Spend Rs 5,000 for Gold",p:s/50};return{name:"New",next:"Spend Rs 1,000 for Silver",p:s/10};}
function myOrders(){return DB.orders.filter(o=>cur&&o.userId===cur.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));}
function myDeposits(){return DB.deposits.filter(d=>cur&&d.userId===cur.id);}
function myTickets(){return DB.tickets.filter(t=>cur&&t.userId===cur.id);}
function myNotifs(){return DB.notifications.filter(n=>cur&&(n.userId==="all"||n.userId===cur.id));}
function unread(){return myNotifs().filter(n=>!(n.readBy||[]).includes(cur.id)).length;}
function serviceCard(s){let pop=DB.orders.filter(o=>o.serviceId===s.id).length,fav=DB.favorites.some(f=>cur&&f.userId===cur.id&&f.serviceId===s.id);return `<div class="card"><div class="row"><div><span class="chip">${esc(s.category)}</span><p style="font-weight:800;margin:10px 0 4px">${esc(s.name)}</p><p class="muted">Min ${s.min} - Max ${s.max} ${pop?` • ${pop} orders`:""}</p><p class="muted">${esc(s.description||"")}</p></div><div style="text-align:right"><b class="green">${money(s.pricePer1000)}<br><span class="muted" style="font-size:11px">/ 1000</span></b><br><button type="button" class="btn2" style="margin-top:8px" onclick="toggleFav('${s.id}')">${fav?"★":"☆"}</button></div></div><button type="button" class="btn" style="margin-top:12px;padding:12px" onclick="orderService('${s.id}')">Order This Service</button></div>`;}
function render(){let a=document.getElementById("app");if(!a)return;a.innerHTML=screen==="auth"?authHTML():userHTML(); updateServerBar();}

function setAuth(m){authMode=m;render();}
function doAuth(){let em=document.getElementById("fEmail"),pw=document.getElementById("fPass"),msg=document.getElementById("authMsg");if(!em||!pw){alert("Form not loaded. Please refresh.");return;}let email=em.value.trim().toLowerCase(),pass=pw.value;if(!email.includes("@")){msg.textContent="Enter a valid email address.";return;}if(pass.length<4){msg.textContent="Password must be at least 4 characters.";return;}let uname=email.split("@")[0];
if(authMode==="signup"){let name=document.getElementById("fName").value.trim();if(!name){msg.textContent="Enter your name.";return;}if(DB.users.some(u=>u.email===email)){msg.textContent="An account with this email already exists. Please log in instead.";return;}let ref=document.getElementById("fRef").value.trim().toUpperCase(),referredBy="";if(ref){let r=DB.users.find(u=>u.referralCode===ref);if(!r){msg.textContent="That referral code is not valid.";return;}referredBy=r.id;}let code="ZAR-"+uname.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+uid().slice(0,4).toUpperCase();let u={id:uid(),name,username:uname,email,password:pass,balance:0,status:"Active",referralCode:code,referredBy,createdAt:new Date().toISOString()};DB.users.push(u);cur=u;save();log("New user signed up: @"+uname);confetti();toast("Account created! Welcome.");screen="user";tab="home";render();}
else{let f=DB.users.find(u=>(u.email===email||u.username===email)&&u.password===pass);if(!f){msg.textContent="Email or password is incorrect.";return;}if(f.status==="Blocked"){msg.textContent="Your account is blocked. Contact support.";return;}cur=f;save();toast("Welcome back, "+f.name+"!");screen="user";tab="home";render();}}
function logout(){cur=null;localStorage.removeItem("zarorat_cur");screen="auth";render();}
function orderService(id){tab="new";render();setTimeout(()=>{let el=document.getElementById("selSvc");if(el)el.value=id;calcPrice();},80);}
function toggleFav(id){if(!cur)return;let i=DB.favorites.findIndex(f=>f.userId===cur.id&&f.serviceId===id);if(i>=0)DB.favorites.splice(i,1);else DB.favorites.push({userId:cur.id,serviceId:id,createdAt:new Date().toISOString()});save();render();}
function calcPrice(){let sel=document.getElementById("selSvc"),q=document.getElementById("qty");if(!sel||!q)return;let s=DB.services.find(x=>x.id===sel.value);let box=document.getElementById("priceBox");if(!box)return;if(!s||!q.value){box.innerHTML="";return;}let est=Math.ceil(Number(q.value)/1000*s.pricePer1000);let coup=document.getElementById("couponIn")?document.getElementById("couponIn").value.trim().toUpperCase():"";let disc=0;if(coup){let c=DB.coupons.find(x=>x.code===coup&&x.active);if(c)disc=Math.floor(est*c.discountPercent/100);}box.innerHTML=`<div class="row"><span class="muted">Estimated Price</span><b>${money(est)}</b></div>${disc?`<div class="row"><span class="muted">Coupon Discount</span><b class="green">- ${money(disc)}</b></div>`:""}<div class="row" style="border-top:1px solid #1e332b;padding-top:8px"><span>You Pay</span><b class="green">${money(Math.max(0,est-disc))}</b></div>`;box.dataset.final=Math.max(0,est-disc);}
function placeOrder(){let sel=document.getElementById("selSvc");if(!sel)return;let link=document.getElementById("link").value.trim(),q=Number(document.getElementById("qty").value),msg=document.getElementById("orderMsg");let s=DB.services.find(x=>x.id===sel.value);if(!s){msg.textContent="Please select a service first.";return;}if(!link.startsWith("http")){msg.textContent="Enter a valid link - must start with http / https.";return;}if(!q||q<s.min||q>s.max){msg.textContent=`Quantity must be between ${s.min} and ${s.max}.`;return;}calcPrice();let final=Number(document.getElementById("priceBox").dataset.final||0);if(cur.balance<final){msg.textContent=`Balance is low. You need ${money(final)}, balance is ${money(cur.balance)}.`;return;}let coup=document.getElementById("couponIn").value.trim().toUpperCase();let c=DB.coupons.find(x=>x.code===coup&&x.active);DB.orders.unshift({id:uid(),userId:cur.id,username:cur.username,serviceId:s.id,serviceName:s.name,link,quantity:q,price:final,status:"Pending",couponCode:c?c.code:"",createdAt:new Date().toISOString()});cur.balance-=final;save();log(`User @${cur.username} placed order: ${s.name} (Qty ${q}, ${money(final)})`);if(cur.referredBy){let r=DB.users.find(u=>u.id===cur.referredBy);if(r){let bonus=Math.floor(final*DB.settings.referralBonus/100);if(bonus>0){r.balance+=bonus;DB.transactions.unshift({id:uid(),userId:r.id,username:r.username,type:"Referral Bonus",title:`Referral bonus from @${cur.username}`,amount:bonus,status:"Paid",createdAt:new Date().toISOString()});notify(r.id,"Referral Bonus Earned",`You earned ${money(bonus)} referral bonus from @${cur.username}.`);}}}save();confetti();toast("Order placed! Sent on Full Heavy Server.");tab="orders";render();}
function submitDeposit(){let amt=Number(document.getElementById("depAmt").value),tid=document.getElementById("depTid").value.trim(),note=document.getElementById("depNote").value.trim(),msg=document.getElementById("depMsg");if(!amt||amt<=0){msg.textContent="Enter a valid amount greater than 0.";return;}if(amt<DB.settings.minDeposit){msg.textContent=`Minimum deposit is ${money(DB.settings.minDeposit)}.`;return;}if(!tid){msg.textContent="Enter your Transaction ID (TID).";return;}DB.deposits.unshift({id:uid(),userId:cur.id,username:cur.username,amount:amt,tid,note,status:"Pending",createdAt:new Date().toISOString()});save();log(`User @${cur.username} requested deposit: ${money(amt)} (TID ${tid})`);toast("Deposit request sent - Full Heavy Server!");msg.textContent="Deposit submitted! Status: Pending.";document.getElementById("depAmt").value="";document.getElementById("depTid").value="";}
function createTicket(){let sub=document.getElementById("tSub").value.trim(),m=document.getElementById("tMsg").value.trim(),msg=document.getElementById("ticketMsg");if(!sub||!m){msg.textContent="Enter subject and message.";return;}DB.tickets.unshift({id:uid(),userId:cur.id,username:cur.username,email:cur.email,subject:sub,message:m,status:"Open",replies:[],createdAt:new Date().toISOString()});save();log(`User @${cur.username} opened ticket: ${sub}`);toast("Ticket created - sent live.");document.getElementById("tSub").value="";document.getElementById("tMsg").value="";render();}
function replyTicket(id){let v=document.getElementById("reply-"+id).value.trim();if(!v)return;let t=DB.tickets.find(x=>x.id===id);t.replies.push({sender:"user",text:v,at:new Date().toISOString()});t.status="Open";save();render();}
function markRead(id){let n=DB.notifications.find(x=>x.id===id);if(n&&!n.readBy.includes(cur.id))n.readBy.push(cur.id);save();render();}
function markAllRead(){myNotifs().forEach(n=>{if(!n.readBy.includes(cur.id))n.readBy.push(cur.id);});save();render();}
function copyText(t,el){if(navigator.clipboard)navigator.clipboard.writeText(t);if(el)el.textContent="Copied!";toast("Copied: "+t);}

if(tab==="wallet"){body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon blue">▤</span> Transaction History</h2><div class="grid3"><div class="mini"><span class="picon">₨</span><p class="muted" style="margin-top:8px">BALANCE</p><b>${money(cur.balance)}</b></div><div class="mini"><span class="picon gold">◈</span><p class="muted" style="margin-top:8px">SPENT</p><b>${money(spent)}</b></div><div class="mini"><span class="picon">◈</span><p class="muted" style="margin-top:8px">REFERRAL</p><b class="green">+ ${money(refEarn)}</b></div></div>`+(wallet.length?wallet.map(r=>`<div class="card"><div class="row"><div><b>${esc(r.title)}</b><p class="muted">${esc(r.detail)} - ${new Date(r.date).toLocaleString()}</p></div><div style="text-align:right"><b class="${r.amount>=0?"green":""}">${r.amount>=0?"+":""}${money(r.amount)}</b><br><span class="chip">${r.status}</span></div></div></div>`).join(""):`<div class="card" style="text-align:center">No transactions yet</div>`);}
if(tab==="notifications"){body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon gold">◎</span> Notifications</h2><p class="muted">${unread()} unread - ${myNotifs().length} total • Live</p>${unread()?`<button type="button" class="btn2" onclick="markAllRead()">Mark all as read</button>`:""}`+(myNotifs().length?myNotifs().map(n=>`<div class="card"><b>${esc(n.title)} ${!(n.readBy||[]).includes(cur.id)?"●":""}</b><p class="muted">${esc(n.message)}</p><p class="muted">${new Date(n.createdAt).toLocaleString()}</p>${!(n.readBy||[]).includes(cur.id)?`<button type="button" class="btn2" onclick="markRead('${n.id}')">Mark as Read</button>`:""}</div>`).join(""):`<div class="card" style="text-align:center">No notifications yet</div>`);}
if(tab==="support"){body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon blue">◉</span> Support / Tickets</h2><p class="muted">${esc(DB.settings.supportMessage)}</p><p class="muted">Contact via Tickets only. Replies appear here live.</p><div class="card"><h3>Create Ticket</h3><label class="label">Subject</label><input id="tSub" class="input" placeholder="e.g. My order is still pending"><label class="label">Message</label><textarea id="tMsg" class="input" rows="4" placeholder="Write your problem in detail..."></textarea><p id="ticketMsg" class="muted"></p><button type="button" class="btn" onclick="createTicket()">Create Ticket</button></div><h3 class="mt">My Tickets <span class="chip">${myTickets().length} tickets</span></h3>`+(myTickets().length?myTickets().map(t=>`<div class="card"><div class="row"><div><b>${esc(t.subject)}</b><p class="muted">${new Date(t.createdAt).toLocaleString()}</p><p>${esc(t.message)}</p></div><span class="pill warn">${t.status}</span></div>${(t.replies||[]).map(r=>`<div class="card" style="background:#08110e"><b>${r.sender==="support"?"SUPPORT":"YOU"}</b> - ${new Date(r.at).toLocaleString()}<p>${esc(r.text)}</p></div>`).join("")}<div class="flex mt"><input id="reply-${t.id}" class="input" style="margin:0" placeholder="Write your reply..."><button type="button" class="btn2" onclick="replyTicket('${t.id}')">Send</button></div></div>`).join(""):`<div class="card" style="text-align:center">No tickets yet</div>`);}
if(tab==="profile"){body+=`<h2 style="font-family:'Space Grotesk'"><span class="picon">●</span> Profile</h2><div class="card"><div class="row"><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(100deg,#00e676,#00c2a8);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#03110a">${esc(cur.name[0]?.toUpperCase())}</div><div style="flex:1"><b>${esc(cur.name)}</b><p class="muted">@${esc(cur.username)} - ${esc(cur.email)}</p></div></div></div>`;body+=`<div class="card"><b><span class="picon gold" style="width:22px;height:22px">♛</span> ${lvl.name} Level</b> - ${lvl.next}<div class="bar mt"><i style="width:${lvl.p}%"></i></div><p class="muted">Levels: New (Rs 0) - Silver (Rs 1,000) - Gold (Rs 5,000) - VIP (Rs 20,000)</p></div>`;body+=`<div class="grid3"><div class="mini"><span class="picon">₨</span><p class="muted" style="margin-top:8px">BALANCE</p><b>${money(cur.balance)}</b></div><div class="mini"><span class="picon blue">≡</span><p class="muted" style="margin-top:8px">ORDERS</p><b>${myOrders().length}</b></div><div class="mini"><span class="picon">✓</span><p class="muted" style="margin-top:8px">STATUS</p><b>${cur.status||"Active"}</b></div></div>`;body+=`<div class="card"><h3><span class="picon gold">◈</span> My Referral</h3><p class="muted">Share your code. When someone signs up with your code, you will earn <b style="color:#fff">${DB.settings.referralBonus}%</b> bonus.</p><div class="flex mt"><input readonly value="${cur.referralCode}" class="input" style="margin:0;font-weight:800"><button type="button" class="btn2" onclick="copyText('${cur.referralCode}',this)">Copy Code</button></div><div class="flex mt"><div class="card" style="flex:1;text-align:center;margin:0"><p class="muted">MY REFERRALS</p><b>${refs.length}</b></div><div class="card" style="flex:1;text-align:center;margin:0"><p class="muted">TOTAL EARNINGS</p><b class="green">${money(refEarn)}</b></div></div>${refs.map(r=>`<div class="row card"><b>${esc(r.name)} (@${esc(r.username)})</b><span class="muted">Joined ${new Date(r.createdAt).toLocaleDateString()}</span></div>`).join("")}</div>`;body+=`<button type="button" class="card" style="width:100%;text-align:left;cursor:pointer" onclick="goTab('wallet')"><span class="picon blue">▤</span> <b>Wallet History</b></button><button type="button" class="card" style="width:100%;text-align:left;cursor:pointer" onclick="goTab('deposit')"><span class="picon">₨</span> <b>Add Funds with Easypaisa</b><br><span class="muted">03493959558 — Mohammad Ajmal</span></button><button type="button" class="btn" style="background:#2a1013;color:#ff8a94;margin-top:14px" onclick="logout()">Logout</button>`;}
return header+body+`</div><nav class="nav"><div class="navin">${[["home","⌂","Home"],["deposit","₨","Deposit"],["new","＋","New"],["orders","≡","Orders"],["favorites","★","Saved"],["support","◉","Support"],["profile","●","Profile"]].map(x=>`<button type="button" class="${tab===x[0]?"on":""}" onclick="goTab('${x[0]}')"><span class="navicon">${x[1]}</span><span>${x[2]}</span></button>`).join("")}</div></nav>`;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fastPull(); });
window.addEventListener('focus',()=>{ fastPull(); });
onRemoteChange=()=>{if(cur){let f=DB.users.find(u=>u.id===cur.id);if(f){cur=f;localStorage.setItem("zarorat_cur",JSON.stringify(cur));}}safeRender();};
loadDB();_lastJSON=JSON.stringify(DB);render();startLiveSync();startMaximumFastServer();
window.doAuth=doAuth;window.setAuth=setAuth;window.goTab=goTab;window.setCat=setCat;window.logout=logout;window.toggleFav=toggleFav;window.orderService=orderService;window.calcPrice=calcPrice;window.placeOrder=placeOrder;window.submitDeposit=submitDeposit;window.createTicket=createTicket;window.replyTicket=replyTicket;window.markRead=markRead;window.markAllRead=markAllRead;window.copyText=copyText;window.reorder=reorder;
</script></body></html>
